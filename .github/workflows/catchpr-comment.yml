name: catchpr-comment

# Runs from the default branch. It downloads the artifact produced by the
# untrusted catchpr workflow and posts a comment. It does not execute the
# pull request's code or the generated test.
on:
  workflow_run:
    workflows: ["catchpr"]
    types: [completed]

permissions: {}

jobs:
  comment:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install trusted catchpr
        run: python -m pip install .
      - name: Download the results artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          python -m catchpr fetch-artifact \
            --repository "$REPO" \
            --run-id "$RUN_ID" \
            --name catchpr-results \
            --dest artifacts
      - name: Post or delete the sticky comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          if [ -z "${PR}" ] || [ "${PR}" = "null" ]; then
            echo "catchpr: no pull request number on workflow_run; staying silent"
            exit 0
          fi
          python -m catchpr comment \
            --results artifacts/catchpr-results.json \
            --repository "$REPO" \
            --pr "$PR"
