name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: py${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: |
          python -m ruff check src tests catchbench
          python -m ruff format --check src tests catchbench
      - name: Mypy
        run: python -m mypy --strict src
      - name: Pytest
        run: python -m pytest --cov=catchpr --cov-fail-under=90

  benchmark:
    name: catchbench mock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Replay the published mock benchmark
        run: python -m catchbench --repeats 3 --workers 2 --output /tmp/mock.json
      - name: Published results match this run
        run: python -m catchbench.compare catchbench/results/mock.json /tmp/mock.json
