name: catchpr

# This workflow executes the code under test. It therefore has a read-only
# token and no secrets. It must not be switched to pull_request_target.
on:
  pull_request:

permissions:
  contents: read

jobs:
  catch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Write the pull request body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.txt"
      - name: Install and run
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python -m pip install .
          python -m catchpr run \
            --repo . \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --title "$PR_TITLE" \
            --body-file "$RUNNER_TEMP/pr-body.txt" \
            --provider mock \
            --json catchpr-results.json \
            --sarif catchpr.sarif \
            --comment catchpr-comment.md \
            --report-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: catchpr-results
          path: |
            catchpr-results.json
            catchpr.sarif
            catchpr-comment.md
          if-no-files-found: error
