[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "catchpr"
version = "0.1.0"
description = "Just-in-time catching tests for pull requests. Comment only when a generated test passes on the base and fails on the head."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kevin Fairley" }]
keywords = ["testing", "pytest", "pull-requests", "catching-tests"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = ["pytest>=7.4,<9"]

[project.optional-dependencies]
dev = ["pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
catchpr = "catchpr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
catchpr = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.coverage.run]
branch = true
source = ["catchpr"]
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "catchbench", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"catchbench/**" = ["E501"]
"demo/**" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
packages = ["catchpr"]
warn_unused_ignores = true
